[project]
name = "vgmixr-pipeline"
version = "0.1.0"
description = "Builds the VGMixr track catalog (catalog/manifest.json) and the shared manifest fixtures."
requires-python = ">=3.13"
dependencies = [
    "mwparserfromhell>=0.7.2",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
