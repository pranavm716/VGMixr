name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each step runs one named check from scripts/check.sh, the same checks as the Stop hook in
# .claude/settings.json. `!cancelled()` runs the remaining checks after one fails, so a run
# reports every failure, not just the first.
jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Forbidden files
        run: bash scripts/check.sh forbidden-files

      - name: Build
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh build

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh unit-tests

      - name: Lint
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh lint

      - name: Format (Spotless)
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh format

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Format (ruff)
        run: bash scripts/check.sh py-format

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh py-lint

      - name: Types (mypy)
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh py-types

      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh py-tests

      - name: Fixtures up to date
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh fixtures
